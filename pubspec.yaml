name: conet_app
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  shared_preferences: ^2.5.4
  state_notifier: ^1.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_card_swiper: ^7.2.0
  flutter_native_splash: ^2.4.7
  

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13


flutter:

 
  uses-material-design: true


  assets:
    - assets/avatars/
    - assets/fonts/
    - assets/logo/
    - assets/onboarding/
    - assets/image/
    


  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
         

#splash screen
flutter_native_splash:
  color: "#ffffff"
  color_dark: "#000000"

  image: assets/image/splash_light.png
  image_dark: assets/image/splash_dark.png

  android: true
  ios: true

  android_12:
    image: assets/image/splash_light.png
    icon_background_color: "#ffffff"



 

